apiVersion: v1
kind: Service
metadata:
  name: {{ include "portfolio-infam.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "portfolio-infam.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "portfolio-infam.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
