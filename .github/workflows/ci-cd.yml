name: CI/CD

on:
  push:
    branches:
      - main
    paths-ignore:
      - helm/portfolio-infam/values.yaml
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Optional image tag to write in Helm values (e.g. a1b2c3d)"
        required: false
        default: ""

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: CI=true npm test -- --watchAll=false --passWithNoTests

  build-push:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.deploy-tag.outputs.image_tag }}
      image_repo: ${{ steps.repo.outputs.name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve lowercase image repository
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Compute deploy tag
        id: deploy-tag
        run: echo "image_tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-gitops:
    name: Update Helm image tag
    runs-on: ubuntu-latest
    needs: build-push
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve image tag to publish
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.image_tag }}" ]; then
            tag="${{ github.event.inputs.image_tag }}"
          else
            tag="${{ needs.build-push.outputs.image_tag }}"
          fi
          echo "value=$tag" >> "$GITHUB_OUTPUT"

      - name: Update Helm values
        run: |
          file="helm/portfolio-infam/values.yaml"
          sed -i.bak -E "s|^(  repository: ).*|\\1\"${{ needs.build-push.outputs.image_repo }}\"|" "$file"
          sed -i.bak -E "s|^(  tag: ).*|\\1\"${{ steps.tag.outputs.value }}\"|" "$file"
          rm -f "$file.bak"

      - name: Commit updated values
        run: |
          if git diff --quiet -- helm/portfolio-infam/values.yaml; then
            echo "No values change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add helm/portfolio-infam/values.yaml
          git commit -m "chore: update portfolio image tag to ${{ steps.tag.outputs.value }}"
          git push
